name: engosoft-learn

services:
  db:
    image: postgres:17-alpine
    container_name: engosoft-learn-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: engosoft_learn
      POSTGRES_USER: engosoft
      POSTGRES_PASSWORD: engosoft-dev
    ports:
      - "55432:5432"
    volumes:
      - engosoft-learn-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engosoft -d engosoft_learn"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  engosoft-learn-db:
