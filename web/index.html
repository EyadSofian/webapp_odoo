<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1656A0" />
    <meta name="description" content="دوراتك ومحاضراتك ومجموعات الدورات من إنجوسوفت في مكان واحد." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="إنجوسوفت" />
    <link rel="icon" href="/favicon.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Theme before first paint, so a dark-mode user never sees a white flash.
      try {
        var t = localStorage.getItem('engosoft.theme');
        var d = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <style>
      /* Launch splash: drawn before any script loads, removed once the app has rendered. */
      #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
        background: linear-gradient(160deg, #1d68bb 0%, #1656A0 45%, #0d3a6e 100%); color: #fff;
        transition: opacity 450ms cubic-bezier(.22,1,.36,1), transform 450ms cubic-bezier(.22,1,.36,1); }
      [data-theme='dark'] #splash { background: linear-gradient(160deg, #134781 0%, #0d3462 50%, #071b33 100%); }
      #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash .sp-center { display: flex; flex-direction: column; align-items: center; gap: 28px; }
      #splash .sp-logo { direction: ltr; display: flex; align-items: center; gap: 18px; }
      #splash .sp-mark { position: relative; width: 96px; height: 96px; display: grid; place-items: center; }
      #splash .sp-mark img { width: 58px; animation: sp-mark 800ms cubic-bezier(.22,1,.36,1) both; }
      #splash .sp-mark svg { position: absolute; inset: 0; transform: rotate(-90deg); }
      #splash .sp-mark circle { fill: none; stroke: rgba(255,255,255,.45); stroke-width: 2; stroke-linecap: round;
        stroke-dasharray: 289; stroke-dashoffset: 289; animation: sp-ring 900ms 150ms cubic-bezier(.22,1,.36,1) forwards; }
      #splash .sp-div { width: 2px; height: 58px; background: rgba(255,255,255,.55); transform: scaleY(0); animation: sp-div 300ms 650ms ease-out forwards; }
      #splash .sp-type { height: 58px; clip-path: inset(0 100% 0 0); animation: sp-type 650ms 780ms cubic-bezier(.22,1,.36,1) forwards; }
      #splash .sp-cap { font: 600 15px/1.4 'IBM Plex Sans Arabic', system-ui, sans-serif; color: rgba(255,255,255,.8); opacity: 0; animation: sp-fade 400ms 1100ms ease-out forwards; }
      #splash .sp-bar { position: relative; width: 140px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(255,255,255,.18); opacity: 0; animation: sp-fade 300ms 1150ms ease-out forwards; }
      #splash .sp-bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: #fff; animation: sp-load 1100ms 1150ms ease-in-out infinite; }
      @keyframes sp-mark { 0% { transform: scale(.3) rotate(-140deg); opacity: 0 } 60% { opacity: 1 } 100% { transform: none; opacity: 1 } }
      @keyframes sp-ring { to { stroke-dashoffset: 0 } }
      @keyframes sp-div { to { transform: scaleY(1) } }
      @keyframes sp-type { from { clip-path: inset(0 100% 0 0); transform: translateX(-10px) } to { clip-path: inset(0 0 0 0); transform: none } }
      @keyframes sp-fade { to { opacity: 1 } }
      @keyframes sp-load { 0% { transform: translateX(-110%) } 100% { transform: translateX(260%) } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation-duration: 1ms !important; animation-delay: 0ms !important; } }
    </style>
    <title>إنجوسوفت | منصة التعلّم</title>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-center">
        <div class="sp-logo">
          <div class="sp-mark">
            <svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="46" /></svg>
            <img src="/brand/engosoft-mark-white.png" alt="" />
          </div>
          <span class="sp-div"></span>
          <img class="sp-type" src="/brand/engosoft-type-white.png" alt="Engosoft" />
        </div>
        <div class="sp-cap">منصة التعلّم</div>
        <div class="sp-bar"></div>
      </div>
    </div>
    <script>
      // Once per session (each app launch); the app calls hideSplash() after its first render.
      (function () {
        var el = document.getElementById('splash');
        var start = performance.now();
        var seen = false;
        try { seen = sessionStorage.getItem('engosoft.splash') === '1'; sessionStorage.setItem('engosoft.splash', '1'); } catch (e) {}
        if (seen) { el.remove(); window.hideSplash = function () {}; return; }
        var done = false;
        window.hideSplash = function () {
          if (done) return; done = true;
          setTimeout(function () {
            el.classList.add('out');
            setTimeout(function () { el.remove(); }, 500);
          }, Math.max(0, 1800 - (performance.now() - start)));
        };
        setTimeout(window.hideSplash, 8000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
